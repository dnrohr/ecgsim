[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ecgsim-modern"
version = "0.1.0"
description = "Modernized ECGSIM parser and application code."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["ecgsim*"]

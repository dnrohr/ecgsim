[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ecgsim-modern"
version = "0.1.0"
description = "Modernized ECGSIM parser and application code."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
ecgsim-case-info = "ecgsim.cli.case_info:main"
ecgsim-export-case = "ecgsim.cli.export_case:main"
ecgsim-source-info = "ecgsim.cli.source_info:main"

[tool.setuptools.packages.find]
include = ["ecgsim*"]

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ECGSIM Viewer</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./src/styles.css">
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="viewer-shell" data-viewer-shell>
      <header class="topbar">
        <div>
          <h1>ECGSIM Viewer</h1>
          <p>Read-only compatibility workspace</p>
        </div>
        <div class="case-actions">
          <label class="case-open">
            <input type="file" accept=".ECGsimcase" data-case-file>
            Open case
          </label>
          <output class="case-status" data-case-status>normal_male2.ECGsimcase</output>
        </div>
      </header>
      <section class="case-summary" aria-label="Loaded case metadata">
        <dl>
          <div>
            <dt>Size</dt>
            <dd data-case-size>--</dd>
          </div>
          <div>
            <dt>Lead systems</dt>
            <dd data-case-leads>--</dd>
          </div>
          <div>
            <dt>Markers</dt>
            <dd data-case-markers>--</dd>
          </div>
          <div>
            <dt>Unsupported</dt>
            <dd data-case-unsupported>--</dd>
          </div>
        </dl>
        <p data-case-notice></p>
      </section>
      <section class="workspace" aria-label="ECGSIM views">
        <section class="pane pane-heart" data-pane="heart">
          <div class="pane-header">
            <h2>Heart</h2>
            <output data-heart-metadata>--</output>
          </div>
          <div class="selection-controls" aria-label="Heart selection controls">
            <label>
              Radius
              <input type="range" min="2" max="60" step="2" value="20" data-heart-radius>
            </label>
            <output data-heart-selection>Node -- / 0 mm / 0 nodes</output>
          </div>
          <div class="viewport heart-viewport" data-heart-viewport></div>
        </section>
        <section class="pane pane-thorax" data-pane="thorax">
          <div class="pane-header">
            <h2>Thorax</h2>
            <output data-thorax-metadata>--</output>
          </div>
          <div class="layer-toggles" aria-label="Thorax layers">
            <label><input type="checkbox" data-toggle-mesh="thorax" checked> Thorax</label>
            <label><input type="checkbox" data-toggle-mesh="leftLung" checked> Left lung</label>
            <label><input type="checkbox" data-toggle-mesh="rightLung" checked> Right lung</label>
          </div>
          <div class="viewport thorax-viewport" data-thorax-viewport></div>
        </section>
        <section class="pane pane-tmp" data-pane="tmp">
          <div class="pane-header">
            <h2>TMP</h2>
            <output data-tmp-metadata>--</output>
          </div>
          <div class="tmp-controls" aria-label="TMP parameter editing">
            <label>
              Parameter
              <select data-tmp-parameter></select>
            </label>
            <label>
              Value
              <input type="number" data-tmp-value disabled>
            </label>
            <button type="button" data-tmp-apply disabled>Apply</button>
            <button type="button" data-tmp-reset-parameter disabled>Reset parameter</button>
            <button type="button" data-tmp-reset-beat>Reset beat</button>
          </div>
          <canvas width="640" height="220" data-tmp-canvas></canvas>
        </section>
        <section class="pane pane-leads" data-pane="leads">
          <div class="pane-header">
            <h2>Leads</h2>
            <output data-leads-metadata>--</output>
          </div>
          <div class="leads-controls" aria-label="Leads controls">
            <label>
              Coupling
              <select data-leads-filter>
                <option value="baseline">Baseline</option>
                <option value="ac">AC</option>
                <option value="dc">DC</option>
              </select>
            </label>
          </div>
          <canvas width="640" height="220" data-leads-canvas></canvas>
        </section>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
